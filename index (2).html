function score(w,p){if(tot(w)<=0&&!w.order)return -20;let s=0;if(p.proj&&w.u.includes(p.proj))s+=4;if(p.where==='ext')s+=w.ex*1.8;if(p.where==='int')s+=(6-Math.abs(3-w.ex))*.3;const r=p.prio||[];if(r.includes('precio'))s+=(6-w.tier)*1.5;if(r.includes('resistencia'))s+=w.res*1.4;if(r.includes('apariencia'))s+=w.lk*1.4;if(r.includes('durabilidad'))s+=(w.du+w.ex)*.7;if(p.budget==='eco')s-=Math.max(0,w.tier-2)*1.5;return s+(w.best?.3:0)}
